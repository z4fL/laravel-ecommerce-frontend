          $ref: '#/components/responses/ServerError'
      security: []
components:
  schemas:
    User:
      required:
        - id
        - name
        - username
        - email
        - created_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'John Doe'
        username:
          type: string
          example: john-doe
        email:
          type: string
          format: email
          example: john@example.com
        created_at:
          type: string
          format: date-time
      type: object
    Token:
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          example: 1|example-token
        token_type:
          type: string
          example: Bearer
      type: object
    ShippingAddress:
      required:
        - id
        - user_id
        - recipient_name
        - phone
        - province
        - city
        - district
        - postal_code
        - address
        - is_default
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        recipient_name:
          type: string
          example: 'John Doe'
        phone:
          type: string
          example: '+6285123456789'
        label:
          type: string
          example: rumah
          nullable: true
          enum:
            - rumah
            - kantor
            - kos
            - apartemen
            - toko
            - gudang
            - lainnya
        province:
          type: string
          example: 'West Java'
        city:
          type: string
          example: Bandung
        district:
          type: string
          example: Coblong
        postal_code:
          type: string
          example: '40132'
        address:
          type: string
          example: 'Jl. Example No. 1'
        is_default:
          type: boolean
          example: true
      type: object
    Product:
      required:
        - id
        - sku
        - name
        - slug
        - description
        - price
        - status
        - stock
      properties:
        id:
          type: integer
          example: 1
        sku:
          type: string
          example: SKU-001
        name:
          type: string
          example: 'Example product'
        slug:
          type: string
          example: example-product
        description:
          type: string
          nullable: true
        price:
          type: integer
          example: 19999
          minimum: 0
        status:
          type: string
          example: published
          enum:
            - draft
            - published
        stock:
          type: integer
          example: 10
        store:
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Example Store'
          type: object
          nullable: true
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
      type: object
    ProductImage:
      required:
        - id
        - product_id
        - path
        - sort_order
      properties:
        id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        path:
          type: string
          example: products/example.jpg
        sort_order:
          type: integer
          example: 1
      type: object
    Category:
      required:
        - id
        - name
        - slug
        - description
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Category
        slug:
          type: string
          example: category
        description:
          type: string
          nullable: true
      type: object
    Tag:
