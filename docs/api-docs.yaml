openapi: 3.0.0
info:
  title: 'REST API E-commerce'
  description: 'REST API for E Commerce Portfolio Project'
  version: 1.0.0
servers:
  - url: 'http://localhost:8000/api/v1'
    description: 'Local Development'
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: 'Register a customer'
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - username
                - email
                - password
                - password_confirmation
                - phone
              properties:
                name:
                  type: string
                  example: 'John Doe'
                  maxLength: 50
                username:
                  type: string
                  pattern: '^[A-Za-z0-9_-]+$'
                  example: john-doe
                  maxLength: 50
                  minLength: 3
                email:
                  type: string
                  format: email
                  example: john@example.com
                  maxLength: 255
                password:
                  type: string
                  format: password
                  example: Password123!
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
                  example: Password123!
                phone:
                  type: string
                  example: '085222555111'
                  maxLength: 20
              type: object
      responses:
        201:
          description: 'User registered.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User created successfully.'
                  data:
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      access_token:
                        type: string
                        example: 1|example-token
                      token_type:
                        type: string
                        example: Bearer
                    type: object
                type: object
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security: []
  /auth/login:
    post:
      tags:
        - Authentication
      summary: 'Authenticate a user'
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                  maxLength: 255
                password:
                  type: string
                  format: password
                  example: Password123!
                  minLength: 8
              type: object
      responses:
        200:
          description: 'Login successful.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Login successful.'
                  data:
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      access_token:
                        type: string
                        example: 1|example-token
                      token_type:
                        type: string
                        example: Bearer
                    type: object
                type: object
        401:
          $ref: '#/components/responses/UnauthorizedError'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
      security: []
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: 'Revoke the current access token'
      operationId: logout
      responses:
        200:
          description: 'Token revoked.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/ServerError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
      security:
        -
          sanctum: []
  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: 'Send a password reset link'
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
              type: object
      responses:
        200:
          description: 'Reset link sent.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
      security: []
  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: 'Reset a password'
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - token
                - email
                - password
                - password_confirmation
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
              type: object
      responses:
        200:
          description: 'Password reset.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        422:
          $ref: '#/components/responses/ValidationError'
        500:
          $ref: '#/components/responses/ServerError'
      security: []
  /cart:
    get:
      tags:
        - Cart
      summary: 'Get the authenticated user cart'
      operationId: getMyCart
      responses:
        200:
          description: 'Current cart.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCart'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
    delete:
      tags:
        - Cart
      summary: 'Remove all items from the authenticated user cart'
      operationId: clearMyCart
      responses:
        200:
          description: 'Cart cleared.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  '/cart/items/{public_product}':
    post:
      tags:
        - Cart
      summary: 'Add a published product to the authenticated user cart'
      operationId: addCartItem
      parameters:
        -
          name: public_product
          in: path
          required: true
          schema:
            type: string
          example: gaming-laptop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  example: 2
                  minimum: 1
              type: object
      responses:
        201:
          description: 'Cart item created or quantity incremented.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCartItem'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  '/cart/items/{item}':
    delete:
      tags:
        - Cart
      summary: 'Delete an owned cart item'
      operationId: deleteCartItem
      parameters:
        -
          name: item
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: 'Cart item deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
    patch:
      tags:
        - Cart
      summary: 'Update an owned cart item quantity'
      operationId: updateCartItem
      parameters:
        -
          name: item
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  example: 4
                  minimum: 1
              type: object
      responses:
        200:
          description: 'Cart item updated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCartItem'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  /categories:
    get:
      tags:
        - Categories
      summary: 'List categories'
      operationId: listCategories
      responses:
        200:
          description: Categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCollection'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security: []
    post:
      tags:
        - Categories
      summary: 'Create a category'
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
              properties:
                name:
                  type: string
                  example: Electronics
                  maxLength: 50
                description:
                  type: string
                  nullable: true
                  maxLength: 1000
                  minLength: 10
              type: object
      responses:
        201:
          description: 'Category created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCategory'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  '/categories/{category}':
    get:
      tags:
        - Categories
      summary: 'Get a category'
      operationId: getCategory
      parameters:
        -
          name: category
          in: path
          required: true
          schema:
            type: string
          example: electronics
      responses:
        200:
          description: Category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCategory'
        404:
          $ref: '#/components/responses/NotFoundError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security: []
    put:
      tags:
        - Categories
      summary: 'Update a category'
      operationId: replaceCategory
      parameters:
        -
          name: category
          in: path
          required: true
          schema:
            type: string
          example: electronics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  maxLength: 50
                description:
                  type: string
                  maxLength: 1000
                  minLength: 10
              type: object
      responses:
        200:
          description: 'Category updated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCategory'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
    delete:
      tags:
        - Categories
      summary: 'Delete a category'
      operationId: deleteCategory
      parameters:
        -
          name: category
          in: path
          required: true
          schema:
            type: string
          example: electronics
      responses:
        200:
          description: 'Category deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
    patch:
      tags:
        - Categories
      summary: 'Update a category'
      operationId: updateCategory
      parameters:
        -
          name: category
          in: path
          required: true
          schema:
            type: string
          example: electronics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  maxLength: 50
                description:
                  type: string
                  maxLength: 1000
                  minLength: 10
              type: object
      responses:
        200:
          description: 'Category updated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCategory'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  '/categories/{category}/restore':
    post:
      tags:
        - Categories
      summary: 'Restore a deleted category'
      operationId: restoreCategory
      parameters:
        -
          name: category
          in: path
          required: true
          schema:
            type: string
          example: electronics
      responses:
        200:
          description: 'Category restored.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  /checkout:
    post:
      tags:
        - Checkout
      summary: 'Preview checkout for the authenticated user cart'
      operationId: previewCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - shipping_address_id
              properties:
                shipping_address_id:
                  type: integer
                  example: 1
              type: object
      responses:
        200:
          description: 'Checkout preview.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCheckout'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  /auth/email/verification-notification:
    post:
      tags:
        - 'Email Verification'
      summary: 'Send an email verification link'
      operationId: sendEmailVerificationNotification
      responses:
        200:
          description: 'Verification notification result.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/ServerError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
      security:
        -
          sanctum: []
  '/email/verify/{id}/{hash}':
    get:
      tags:
        - 'Email Verification'
      summary: 'Verify a user email address'
      operationId: verifyEmail
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
        -
          name: hash
          in: path
          required: true
          schema:
            type: string
          example: a-sha1-email-hash
        -
          name: expires
          in: query
          required: true
          schema:
            type: integer
          example: 1735689600
        -
          name: signature
          in: query
          required: true
          schema:
            type: string
          example: signed-url-signature
      responses:
        200:
          description: 'Email verification result.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ServerError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
      security: []
  /orders:
    get:
      tags:
        - Orders
      summary: 'List orders belonging to the authenticated user'
      operationId: listMyOrders
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: per_page
          in: query
          schema:
            type: integer
            maximum: 100
            minimum: 1
      responses:
        200:
          description: 'Paginated owned orders.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
    post:
      tags:
        - Orders
      summary: 'Create an order from the authenticated user cart'
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - shipping_address_id
              properties:
                shipping_address_id:
                  type: integer
                  example: 1
              type: object
      responses:
        201:
          description: 'Order created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOrder'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  '/orders/{order}':
    get:
      tags:
        - Orders
      summary: 'Get an owned order'
      operationId: getMyOrder
      parameters:
        -
          name: order
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: Order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOrder'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  '/orders/{order}/cancel':
    post:
      tags:
        - Orders
      summary: 'Cancel an owned cancellable order'
      operationId: cancelMyOrder
      parameters:
        -
          name: order
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: 'Order cancelled or returned idempotently.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOrder'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  '/orders/{order}/payment':
    post:
      tags:
        - Payments
      summary: 'Create or reuse a pending payment for an order'
      description: 'The current implementation authenticates and verifies the caller but does not enforce order ownership in PaymentController or a payment policy.'
      operationId: createPayment
      parameters:
        -
          name: order
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        201:
          description: 'Payment created or existing active payment reused.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPayment'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security:
        -
          sanctum: []
  /products:
    get:
      tags:
        - Products
      summary: 'List published products'
      operationId: listPublicProducts
      parameters:
        -
          name: search
          in: query
          schema:
            type: string
        -
          name: category
          in: query
          schema:
            type: string
        -
          name: tag
          in: query
          schema:
            type: string
        -
          name: min_price
          in: query
          schema:
            type: number
            minimum: 0
        -
          name: max_price
          in: query
          schema:
            type: number
            minimum: 0
        -
          name: in_stock
          in: query
          schema:
            type: boolean
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - '-name'
              - price
              - '-price'
              - created_at
              - '-created_at'
              - updated_at
              - '-updated_at'
        -
          name: page
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: per_page
          in: query
          schema:
            type: integer
            maximum: 100
            minimum: 1
      responses:
        200:
          description: 'Paginated published products.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
      security: []
  '/products/{public_product}':
    get:
      tags:
        - Products
      summary: 'Get a published product'
      operationId: getPublicProduct
      parameters:
        -
          name: public_product
          in: path
          required: true
          schema:
            type: string
          example: gaming-laptop
      responses:
        200:
          description: Product.
          content:
            application/json:
              schema:
